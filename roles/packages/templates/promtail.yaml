server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: https://loki.breeze-blocks.net/loki/api/v1/push
    tls_config:
      insecure_skip_verify: true

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
          stream: stdout
  - job_name: dirs
    static_configs:
      - targets:
          - localhost
        labels:
          __path__: /var/log/**/*log
          app: dirs
          host: {{ inventory_hostname }}
          hostname: {{ inventory_hostname }}.breeze-blocks.net
          jobs: dirs
          node: {{ inventory_hostname }}
          stream: stdout
  - job_name: journal
    journal:
      json: false
      max_age: 12h
      path: /var/log/journal
      matches: _TRANSPORT=kernel
      labels:
        app: journald
        host: {{ inventory_hostname }}
        hostname: {{ inventory_hostname }}.breeze-blocks.net
        job: journal
        node: {{ inventory_hostname }}
        stream: stdout
    relabel_configs:
      - source_labels:
          - __journal__systemd_unit
        target_label: systemd_unit
      - source_labels:
          - __journal__hostname
        target_label: nodename
      - source_labels:
          - __journal_syslog_identifier
        target_label: syslog_identifier
