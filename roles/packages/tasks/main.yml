---
# tasks file for packages
- name: Clean user package cache
  ansible.builtin.file:
    dest: >-
      ~/.cache/yay
    state: absent
  become: true
- name: Stat cache directory
  ansible.builtin.stat:
    dest: >-
      ~/.cacche/yay
  register: packages_cache
- name: Test directory is gone
  ansible.builtin.assert:
    that:
      - not packages_cache.stat.exists
- name: Update user package cache
  ansible.builtin.command:
    cmd: yay -Y --gendb
    creates: >-
      ~/.cache/yay
- name: Install extra packages
  ansible.builtin.command:
    cmd: >-
      yay -S --noconfirm {{ packages_item }}
    creates: >-
      ~/.cache/yay/{{ packages_item }}
  loop: >-
    {{ packages_list }}
  loop_control:
    loop_var: packages_item
- name: Make gmotd config dir
  ansible.builtin.file:
    dest: /etc/gmotd
    state: directory
    owner: root
  become: true
- name: Copy gmotd yaml
  ansible.builtin.copy:
    src: gmotd.yaml
    dest: /etc/gmotd/gmotd.yaml
    owner: root
  become: true
