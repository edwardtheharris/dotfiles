- name: Update package cache
  community.general.pacman:
    executable: /usr/bin/yay
    update_cache: true
- name: Install extra packages
  community.general.pacman:
    executable: /usr/bin/yay
    name: >-
      {{ packages_item }}
    state: present
  loop: >-
    {{ packages_list }}
  loop_control:
    loop_var: packages_item
  notify:
    - Enable node exporter
    - Start systemd exporter
- name: Make gmotd config dir
  ansible.builtin.file:
    dest: /etc/gmotd
    state: directory
    owner: root
    group: root
    mode: ug+rwx
  become: true
- name: Template gmotd
  ansible.builtin.template:
    src: gmotd.yaml
    dest: /etc/gmotd/gmotd.yaml
    owner: root
    group: root
    mode: ug+rw
  become: true
- name: Copy pam.d config
  ansible.builtin.copy:
    src: sshd
    dest: /etc/pam.d/sshd
    mode: ug+rw
    owner: root
    group: root
  become: true
